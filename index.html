<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My DevOps Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #243047;
            text-align: center;
            padding: 60px 20px;
        }
        .card {
            max-width: 600px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000012;
        }
        h1 { color: #1769aa; }
        .tag {
            display: inline-block;
            margin: 5px;
            padding: 8px 12px;
            background: #e4f1ff;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome to My DevOps Portfolio!</h1>
        <p>This website is running inside a Docker container.</p>
        <h3>Technologies I'm Practicing</h3>
        <span class="tag">Linux</span>
        <span class="tag">Docker</span>
        <span class="tag">Nginx</span>
        <span class="tag">Git</span>
        <p>Learning by building, testing, and automating.</p>
    </div>
</body>
</html>
